services:
  api:
    build:
      context: .
      target: dev
    # Database settings come from .env (the shared Neon DB by default).
    env_file:
      - path: .env
        required: false
    # Redis is local to each developer (README, "Redis"). Set REDIS_URL in .env to override.
    environment:
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    # Only CI migrates the shared `public` schema (README, "Database"). On startup we
    # migrate only your own dev_<name> schema.
    command: >
      sh -c "if [ \"$${DB_SCHEMA:-public}\" != public ]; then alembic upgrade head; fi &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    volumes:
      - .:/app

  redis:
    image: redis:7-alpine
    # No host port: only the api container talks to it. Data is kept in the redisdata volume.
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Optional offline Postgres: `docker compose --profile local-db up`, and in .env set
  # DATABASE_URL=postgresql://postgres:postgres@db:5432/notchs, empty
  # MIGRATION_DATABASE_URL and DB_USE_POOLER=false.
  db:
    image: postgres:18-alpine
    profiles: ["local-db"]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: notchs
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d notchs"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
  redisdata:
