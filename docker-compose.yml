services:
  api:
    build:
      context: .
      target: dev
    # Database settings come from .env (the shared Neon DB by default).
    env_file:
      - path: .env
        required: false
    ports:
      - "8000:8000"
    # Only CI migrates the shared `public` schema (docs/WORKPLAN.md §0.1). On startup we
    # migrate only your own dev_<name> schema.
    command: >
      sh -c "if [ \"$${DB_SCHEMA:-public}\" != public ]; then alembic upgrade head; fi &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    volumes:
      - .:/app

  # Optional offline Postgres: `docker compose --profile local-db up`, and in .env set
  # DATABASE_URL=postgresql://postgres:postgres@db:5432/city_wrapped, empty
  # MIGRATION_DATABASE_URL and DB_USE_POOLER=false.
  db:
    image: postgres:18-alpine
    profiles: ["local-db"]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: city_wrapped
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d city_wrapped"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
