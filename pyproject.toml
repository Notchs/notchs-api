[project]
name = "notchs-api"
version = "0.1.0"
description = "Backend API for the Notchs web application."
requires-python = ">=3.14"

[tool.ruff]
line-length = 100
target-version = "py314"
extend-exclude = ["alembic/versions", "docs"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "ASYNC", "N", "RUF"]
ignore = [
    "B008",  # FastAPI uses function calls (Depends/Query) in defaults
    "N818",  # *Exception naming is our convention (AppException, NotFoundException, ...)
]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
